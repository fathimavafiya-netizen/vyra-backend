<!DOCTYPE html>
<html>
<head><title>Login Test</title></head>
<body>
  <h1>Login Test</h1>
  <form id="loginForm">
    <input type="text" id="email" placeholder="Email" value="testuser123@sociall.com" />
    <input type="password" id="password" placeholder="Password" value="Password123!" />
    <button type="submit">Login</button>
  </form>
  <pre id="output"></pre>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const output = document.getElementById('output');
      output.innerText = 'Logging in...';
      try {
        const res = await fetch('http://localhost:5000/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include', // THIS IS CRITICAL
          body: JSON.stringify({ 
            email, 
            password,
            deviceId: 'browser-test-id',
            deviceName: 'Browser Test Device',
            appVersion: '1.0.0',
            platform: 'WEB'
          })
        });
        const data = await res.json();
        if (data.success) {
          output.innerText = 'Login successful! Cookies should be set.\n' + JSON.stringify(data, null, 2);
        } else {
          output.innerText = 'Login failed.\n' + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        output.innerText = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
